<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Route Viewshed</title>
<style>
  body { font-family: -apple-system, sans-serif; max-width: 480px; margin: 60px auto; color: #1b1b1b; }
  h1 { font-size: 20px; }
  label { display: block; margin-top: 16px; font-size: 14px; }
  input[type=file], input[type=number], input[type=text] { display: block; margin-top: 6px; width: 100%;
    box-sizing: border-box; padding: 6px; font-size: 14px; }
  button { margin-top: 24px; padding: 10px 20px; font-size: 15px; cursor: pointer; }
  button:disabled { cursor: not-allowed; opacity: 0.6; }
  #processing { display: none; margin-top: 16px; font-size: 14px; color: #555; }
  .hint { font-size: 12px; color: #777; margin-top: 2px; }
</style>
</head>
<body>

<h1>Route Viewshed</h1>
<p><a href="{{ url_for('dashboard') }}">&larr; Saved routes</a></p>
<p>Upload a GPX track. The DEM, reprojection, and viewshed computation all happen automatically.</p>

<form id="upload-form" action="/run" method="post" enctype="multipart/form-data">
  <label>
    GPX file
    <input type="file" name="gpx" accept=".gpx" required>
  </label>

  <label>
    Label (optional)
    <input type="text" name="label" placeholder="e.g. Mt. Whitney Summit">
    <span class="hint">Defaults to the GPX filename if left blank.</span>
  </label>

  <label>
    Eye height (meters)
    <input type="number" name="eye_height_m" value="10" step="0.1" min="0">
    <span class="hint">Default 10m &mdash; deliberately more generous than a standing person's eye level, to allow for GPS/coordinate imprecision.</span>
  </label>

  <label>
    Step distance (miles)
    <input type="number" name="step_distance_mi" value="0.5" step="0.05" min="0.01">
    <span class="hint">How far apart the sample points are along the route. Default 0.5 miles.</span>
  </label>

  <button type="submit" id="submit-btn">Compute viewshed</button>
  <div id="processing">Uploading&hellip;</div>
</form>

<script>
document.getElementById('upload-form').addEventListener('submit', () => {
  document.getElementById('submit-btn').disabled = true;
  document.getElementById('processing').style.display = 'block';
});
</script>

</body>
</html>
