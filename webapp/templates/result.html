<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>{{ label }} — Route Viewshed Viewer</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
  html, body { margin: 0; height: 100%; font-family: -apple-system, sans-serif; }
  #map { position: absolute; top: 0; bottom: 64px; left: 0; right: 0; }
  #controls {
    position: absolute; bottom: 0; left: 0; right: 0; height: 64px;
    background: #1b1b1b; color: #eee; display: flex; align-items: center;
    padding: 0 16px; gap: 16px; box-sizing: border-box;
  }
  #controls input[type=range] { flex: 1; }
  #readout { min-width: 220px; font-size: 14px; white-space: nowrap; }
  #play-btn { background: #333; color: #eee; border: 1px solid #555; border-radius: 4px;
    padding: 6px 14px; font-size: 14px; cursor: pointer; }
  #play-btn:hover { background: #444; }
  #status { position: absolute; top: 10px; left: 50px; z-index: 1000; background: white;
    padding: 6px 10px; border-radius: 4px; font-size: 13px; box-shadow: 0 1px 4px rgba(0,0,0,0.3); }
  #back { position: absolute; top: 10px; right: 10px; z-index: 1000; background: white;
    padding: 6px 12px; border-radius: 4px; font-size: 13px; text-decoration: none; color: #1b1b1b;
    box-shadow: 0 1px 4px rgba(0,0,0,0.3); }
  #feature-panel { position: absolute; top: 10px; left: 10px; z-index: 1000; background: white;
    border-radius: 4px; padding: 6px 10px; max-height: 40vh; overflow-y: auto;
    box-shadow: 0 1px 4px rgba(0,0,0,0.3); font-size: 13px; max-width: 240px; }
  #feature-list { margin: 6px 0 0; padding-left: 18px; }
</style>
</head>
<body>

<div id="map"></div>
<div id="status">Loading route_viewsheds.geojson...</div>
<a id="back" href="/">&larr; Saved routes</a>
<details id="feature-panel" open>
  <summary id="feature-panel-summary">Named features along this route</summary>
  <ul id="feature-list"></ul>
</details>
<div id="controls">
  <button id="play-btn" disabled>&#9654; Play</button>
  <span id="readout">--</span>
  <input type="range" id="slider" min="0" max="0" value="0" step="1" disabled>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>window.ROUTE_ID = {{ route_id|tojson }};</script>
<script src="{{ url_for('static', filename='viewer.js') }}"></script>

</body>
</html>
